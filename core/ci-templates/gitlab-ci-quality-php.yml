# .gitlab-ci.yml — Snippet: PHP/Symfony quality gates
# PHPStan + PHP-CS-Fixer + PHPUnit

quality-php:
  stage: quality
  image: php:8.3-cli
  before_script:
    # Install Composer with checksum verification (official procedure: https://getcomposer.org/download/)
    - |
      EXPECTED_CHECKSUM="$(php -r 'copy("https://composer.github.io/installer.sig", "php://stdout");')"
      php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
      ACTUAL_CHECKSUM="$(php -r "echo hash_file('sha384', 'composer-setup.php');")"
      if [ "$EXPECTED_CHECKSUM" != "$ACTUAL_CHECKSUM" ]; then
        echo 'ERROR: invalid Composer installer checksum' >&2
        rm composer-setup.php
        exit 1
      fi
      php composer-setup.php --install-dir=/usr/local/bin --filename=composer
      rm composer-setup.php
    - composer install --no-interaction --no-progress
  script:
    - vendor/bin/php-cs-fixer fix --dry-run --diff --verbose
    - vendor/bin/phpstan analyse --level=8 src/ --no-progress
    - vendor/bin/phpunit --coverage-text --coverage-clover=coverage.xml
  coverage: '/Lines:\s+(\d+\.\d+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  only:
    - merge_requests
    - develop
    - main
