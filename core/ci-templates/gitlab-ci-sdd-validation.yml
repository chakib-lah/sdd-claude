# .gitlab-ci.yml — Snippet: SDD validation before deployment
# Add this job to your existing GitLab CI pipeline.
# This job checks that each feature has a spec.md with status: approved before merging.

sdd-spec-check:
  stage: validate
  image: alpine:latest
  script:
    - |
      BRANCH="${CI_COMMIT_REF_NAME}"
      # Extract the TICKET-ID from the branch name (e.g. feature/PROJ-101-description)
      TICKET=$(echo "$BRANCH" | grep -oE '[A-Z]+-[0-9]+' | head -1)

      if [ -z "$TICKET" ]; then
        echo "ℹ️  No TICKET-ID in the branch name — skipping SDD check"
        exit 0
      fi

      # Look for the matching SDD directory
      SDD_DIR=$(find .claude/sdd -maxdepth 1 -type d -name "${TICKET}*" | head -1)

      if [ -z "$SDD_DIR" ]; then
        echo "⚠️  No SDD directory found for $TICKET — feature without SDD spec"
        exit 0
      fi

      SPEC_FILE="$SDD_DIR/spec.md"

      if [ ! -f "$SPEC_FILE" ]; then
        echo "❌ spec.md missing in $SDD_DIR"
        exit 1
      fi

      STATUS=$(grep '^status:' "$SPEC_FILE" | head -1 | awk '{print $2}')

      if [ "$STATUS" != "approved" ] && [ "$STATUS" != "implemented" ]; then
        echo "❌ spec.md not approved for $TICKET (status: $STATUS)"
        echo "   Action: set spec.md to status: approved before merging"
        exit 1
      fi

      echo "✅ spec.md approved for $TICKET (status: $STATUS)"
  only:
    - merge_requests
  allow_failure: false
