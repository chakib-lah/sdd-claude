# .gitlab-ci.yml — Snippet: frontend/backend OpenAPI sync check
# For Symfony+Angular, Angular+Node or Spring Boot+Angular projects with OpenAPI.
# This job checks that the Angular types are synchronized with the backend OpenAPI.

openapi-sync-check:
  stage: validate
  image: node:20-alpine
  script:
    - |
      # Unpredictable temp dir (avoid fixed /tmp paths on shared runners)
      TMP_DIR="$(mktemp -d)"

      # Generate the OpenAPI spec from the backend
      # Symfony: php bin/console api:doc:dump > "$TMP_DIR/openapi.json"
      # Node.js with swagger-jsdoc:
      #   node scripts/generate-openapi.js > "$TMP_DIR/openapi.json"
      # Spring Boot (springdoc): ./gradlew generateOpenApiDocs && cp build/openapi.json "$TMP_DIR/openapi.json"
      #   (the plugin forks bootRun: image with JDK + Node required, app must be able to start in CI — see api-contracts.md)

      # Regenerate the Angular types in a temporary directory
      npx @openapitools/openapi-generator-cli generate \
        -i "$TMP_DIR/openapi.json" \
        -g typescript-angular \
        -o "$TMP_DIR/generated-types"

      # Compare with the committed types
      diff -r frontend/src/app/generated/ "$TMP_DIR/generated-types/" || {
        echo "❌ Angular types out of sync with the backend OpenAPI"
        echo "   Action: re-run npm run api:sync and commit the generated types"
        exit 1
      }

      echo "✅ Angular types synchronized with the backend OpenAPI"
  only:
    - merge_requests
  allow_failure: false
